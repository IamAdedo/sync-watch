name: Continuous Deployment - Android APK & Bundle

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-deploy:
    name: Build Next.js & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js (for Next.js export)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
        continue-on-error: true

      - name: 3. Build & Sync Next.js Web Assets (If Next.js present)
        run: |
          if [ -f "package.json" ]; then
            echo "Building root Next.js project..."
            npm ci || npm install
            npm run build
            if [ -d "out" ]; then
              mkdir -p app/src/main/assets/www
              cp -r out/* app/src/main/assets/www/
              echo "Next.js static export synced to app/src/main/assets/www/"
            fi
          elif [ -d "web" ] && [ -f "web/package.json" ]; then
            echo "Building web/ Next.js project..."
            cd web
            npm ci || npm install
            npm run build
            if [ -d "out" ]; then
              cd ..
              mkdir -p app/src/main/assets/www
              cp -r web/out/* app/src/main/assets/www/
              echo "Next.js static export synced from web/out to app/src/main/assets/www/"
            fi
            cd ..
          else
            echo "Using bundled assets in app/src/main/assets/www"
          fi

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 6. Decode Release Keystore (if configured in Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding upload keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "No custom KEYSTORE_BASE64 secret found. Using debug keystore configuration."
          fi

      - name: 7. Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: 8. Build Debug & Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: 9. Build Android App Bundle (AAB for Google Play)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          gradle bundleRelease --no-daemon || echo "Skipping AAB bundle build if release signing is not configured"

      - name: 10. Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-and-release-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: 11. Determine Release Tag and Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=Automated Build #${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: 12. Create GitHub Release with APK on Tag / Main Push
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          body: |
            ## Automated Continuous Deployment Build
            - Triggered by commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Capacitor Next.js Android Hybrid Wrapper
            
            ### Download Binaries:
            - Download the attached `.apk` files below to test directly on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
